[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "streakkeeper"
version = "0.1.4"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.51,<2",
    "PySide6-Essentials>=6.8,<7",
    "psutil>=7,<8; sys_platform == 'win32'",
    "tzdata; sys_platform == 'win32'",
]

[project.gui-scripts]
streakkeeper = "streakkeeper.app:main"

[tool.setuptools.packages.find]
where = ["src"]
