name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false

      - name: Run tests on Windows
        run: uv run --locked --python 3.11 python -m unittest discover -s tests -v

      - name: Build the portable app
        run: >-
          uv run --locked --python 3.11 --with pyinstaller==6.22.3 pyinstaller
          --onedir --windowed --name StreakKeeper --paths src src/streakkeeper/__main__.py

      - name: Smoke test the executable and Chrome profile
        run: uv run --locked --python 3.11 python tests/windows_smoke.py dist/StreakKeeper/StreakKeeper.exe

      - name: Create ZIP and checksum
        run: |
          $version = uv run --locked --python 3.11 python -c "from importlib.metadata import version; print(version('streakkeeper'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = "StreakKeeper-$version-windows-x64.zip"
          Compress-Archive -Path dist/StreakKeeper -DestinationPath "dist/$zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$zip").Hash.ToLowerInvariant()
          Set-Content -Encoding ascii -Path "dist/$zip.sha256" -Value "$hash  $zip"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: streakkeeper-windows-x64
          path: |
            dist/StreakKeeper-*-windows-x64.zip
            dist/StreakKeeper-*-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
